name: Arm auto-merge
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge -R "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"
